<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Able Player</title>
    <link rel="stylesheet" href="build/ableplayer.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="player-section">
      <!-- Do not add `controls`: the browser native UI stacks on top of Able Player. -->
      <video id="video1" data-able-player preload="metadata"></video>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>

    <!--
      Able Player auto-inits from data-able-player on jQuery ready
      (DOMContentLoaded), which fires after all defer and module scripts.
      So mountDltsPlayer in demo.js sets poster/tracks before init.
    -->
    <script defer src="build/ableplayer.min.js"></script>
    <script type="module" src="js/demo.js"></script>
  </body>
</html>
